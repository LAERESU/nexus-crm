name: ci-backend

on:
  pull_request:
    branches: [develop, main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'NexUS.sln'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'global.json'
      - 'dotnet-tools.json'
      - 'scripts/check-coverage.sh'
      - 'scripts/check-vulnerable-packages.sh'
      - '.github/workflows/ci-backend.yml'
  schedule:
    - cron: '0 2 * * 1' # pindai ulang advisory baru walau tidak ada perubahan kode
  push:
    branches: [develop, main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'NexUS.sln'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'global.json'
      - 'dotnet-tools.json'
      - 'scripts/check-coverage.sh'
      - 'scripts/check-vulnerable-packages.sh'
      - '.github/workflows/ci-backend.yml'

concurrency:
  group: ci-backend-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build-test:
    name: backend-build-test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore NexUS.sln

      - name: Build (warning dianggap error)
        run: dotnet build NexUS.sln -c Release --no-restore

      - name: Test dengan coverage
        run: >
          dotnet test NexUS.sln -c Release --no-build
          --collect:"XPlat Code Coverage" --results-directory ./coverage

      - name: Gate coverage (minimal 70%)
        run: scripts/check-coverage.sh 70 coverage

      - name: Ringkasan coverage
        if: always()
        run: |
          if [ -f coverage/report/SummaryGithub.md ]; then
            cat coverage/report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/report
          if-no-files-found: ignore

  vulnerable-packages:
    name: vulnerable-packages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore NexUS.sln

      - name: Cek paket NuGet rentan (High/Critical)
        run: scripts/check-vulnerable-packages.sh NexUS.sln
