name: ci-frontend

on:
  pull_request:
    branches: [develop, main]
    paths:
      - 'web/**'
      - '.github/workflows/ci-frontend.yml'
  schedule:
    - cron: '0 2 * * 1' # pindai ulang advisory baru walau tidak ada perubahan kode
  push:
    branches: [develop, main]
    paths:
      - 'web/**'
      - '.github/workflows/ci-frontend.yml'

concurrency:
  group: ci-frontend-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    working-directory: web

jobs:
  build-test:
    name: frontend-build-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  npm-audit:
    name: npm-audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Audit dependency (High/Critical), cukup dari package-lock.json
        run: npm audit --package-lock-only --audit-level=high
