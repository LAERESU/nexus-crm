server {
  listen 8080;
  root /usr/share/nginx/html;

  # Header keamanan harus diulang di setiap location yang memakai add_header sendiri.
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  # Ant Design menyisipkan style inline (CSS-in-JS), sehingga style-src membutuhkan 'unsafe-inline'.
  add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' wss:; img-src 'self' data:;" always;

  # SPA fallback
  location / {
    try_files $uri /index.html;
  }

  # Aset ber-hash dari Vite boleh di-cache lama.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' wss:; img-src 'self' data:;" always;
  }
}
